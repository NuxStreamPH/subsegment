[package]
name = "subsegment"
version = "0.1.4"
edition = "2021"
description = "A Rust-based radio stream engine that ingests, normalize, transcode and proxies broadcast streams."
license = "MIT"
repository = "https://github.com/nuxstream/subsegment"
rust-version = "1.89"

[lib]
name = "subsegment"
path = "src/lib.rs"

[[bin]]
name = "subsegment"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
figment = { version = "0.10", features = ["yaml", "env", "test"] }
futures = "0.3"
futures-util = "0.3"
form_urlencoded = "1"
hmac = "0.12"
ipnet = "2"
num_cpus = "1"
once_cell = "1"
prometheus = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tower = { version = "0.5", features = ["limit"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[features]
default = ["gstreamer"]
# GStreamer is the default primary. Build with --no-default-features for
# an FFmpeg-only binary without native GStreamer link dependencies.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

# Route all transcode profiles through the in-process GStreamer backend with
# no FFmpeg fallback (stage 4 of the migration — only remove ffmpeg after
# parity is proven). Implies `gstreamer`.
gstreamer_only = ["gstreamer"]

[dependencies.gstreamer]
version = "0.23"
optional = true

[dependencies.gstreamer-app]
version = "0.23"
optional = true

[dev-dependencies]
figment = { version = "0.10", features = ["yaml", "env", "test"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
